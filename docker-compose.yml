services:
  careersetu:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=${RAILWAY_PUBLIC_DOMAIN}
      - NEXT_PUBLIC_API_URL=${RAILWAY_PUBLIC_DOMAIN}
  
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${RAILWAY_PUBLIC_DOMAIN}
