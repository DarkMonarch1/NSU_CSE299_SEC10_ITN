version: "3.9"

services:
  careersetu:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      - ml-service

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.ml_main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
